<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Tom Sloan - Portfolio</title>
		<meta
			name="description"
			content="Tom Sloan: Payload Sensor Specialist at NRC Aerospace. Sensors, autonomous systems, robotics and applied AI."
		/>
		<meta name="color-scheme" content="dark light" />

		<link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="mask-icon" href="safari-pinned-tab.svg" color="#6e9fd0" />

		<!-- Apply saved theme before first paint -->
		<script>
			try {
				var t = localStorage.getItem("theme");
				if (t === "light" || t === "dark")
					document.documentElement.setAttribute("data-theme", t);
			} catch (e) {}
		</script>

		<style>
			:root {
				color-scheme: dark;
				--bg: #0c0c0d;
				--surface: #131314;
				--line: #26262a;
				--line-strong: #3a3a40;
				--text: #b8b8bf;
				--heading: #f5f5f6;
				--muted: #85858e;
				--accent: #6e9fd0;
				--accent-soft: rgba(110, 159, 208, 0.12);
				--nav-bg: rgba(12, 12, 13, 0.92);
				--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
					"Helvetica Neue", Arial, "Noto Sans", sans-serif;
				--mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
					"Liberation Mono", monospace;
				--radius: 3px;
			}
			@media (prefers-color-scheme: light) {
				:root:not([data-theme="dark"]) {
					color-scheme: light;
					--bg: #f6f6f7;
					--surface: #ffffff;
					--line: #dcdce0;
					--line-strong: #bdbdc4;
					--text: #3a3a41;
					--heading: #101012;
					--muted: #66666f;
					--accent: #2a5f94;
					--accent-soft: rgba(42, 95, 148, 0.09);
					--nav-bg: rgba(246, 246, 247, 0.94);
				}
			}
			:root[data-theme="light"] {
				color-scheme: light;
				--bg: #f6f6f7;
				--surface: #ffffff;
				--line: #dcdce0;
				--line-strong: #bdbdc4;
				--text: #3a3a41;
				--heading: #101012;
				--muted: #66666f;
				--accent: #2a5f94;
				--accent-soft: rgba(42, 95, 148, 0.09);
				--nav-bg: rgba(246, 246, 247, 0.94);
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			* {
				margin: 0;
			}
			html {
				scroll-behavior: smooth;
				scroll-padding-top: 64px;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				font-size: 0.9375rem;
				line-height: 1.6;
				-webkit-font-smoothing: antialiased;
			}
			a {
				color: inherit;
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 3px;
			}
			.wrap {
				max-width: 760px;
				margin: 0 auto;
				padding: 0 24px;
			}
			section {
				padding-top: 48px;
			}
			h1,
			h2,
			h3 {
				color: var(--heading);
				line-height: 1.2;
			}
			h1 {
				font-size: clamp(2rem, 1.4rem + 2.6vw, 2.75rem);
				letter-spacing: -0.03em;
			}
			h2 {
				font-family: var(--mono);
				font-size: 0.8125rem;
				font-weight: 600;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--accent);
				padding-bottom: 8px;
				margin-bottom: 4px;
				border-bottom: 1px solid var(--line);
			}
			h3 {
				font-size: 1rem;
			}
			.mono {
				font-family: var(--mono);
				font-size: 0.8125rem;
				color: var(--muted);
			}
			.link {
				color: var(--accent);
				text-decoration: none;
			}
			.link:hover {
				text-decoration: underline;
				text-underline-offset: 3px;
			}

			/* nav */
			header {
				position: fixed;
				inset: 0 0 auto 0;
				z-index: 10;
				background: var(--nav-bg);
				-webkit-backdrop-filter: blur(8px);
				backdrop-filter: blur(8px);
				border-bottom: 1px solid var(--line);
			}
			.nav-inner {
				max-width: 760px;
				margin: 0 auto;
				padding: 0 24px;
				height: 52px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
			}
			.logo {
				font-family: var(--mono);
				font-weight: 700;
				color: var(--heading);
				text-decoration: none;
			}
			.logo span {
				color: var(--accent);
			}
			nav {
				display: flex;
				gap: 16px;
				margin-left: auto;
			}
			nav a {
				font-size: 0.8125rem;
				color: var(--muted);
				text-decoration: none;
			}
			nav a:hover {
				color: var(--heading);
			}
			#themeBtn {
				width: 34px;
				height: 34px;
				display: grid;
				place-items: center;
				border-radius: var(--radius);
				border: 1px solid var(--line-strong);
				background: transparent;
				color: var(--heading);
				cursor: pointer;
			}
			#themeBtn:hover {
				border-color: var(--accent);
				background: var(--accent-soft);
			}
			#themeBtn svg {
				width: 16px;
				height: 16px;
			}
			.theme-moon,
			:root[data-theme="light"] .theme-moon {
				display: none;
			}
			:root:not([data-theme="light"]) .theme-sun {
				display: none;
			}
			:root:not([data-theme="light"]) .theme-moon {
				display: block;
			}
			@media (prefers-color-scheme: light) {
				:root:not([data-theme]) .theme-sun {
					display: block;
				}
				:root:not([data-theme]) .theme-moon {
					display: none;
				}
			}
			:root[data-theme="light"] .theme-sun {
				display: block;
			}
			@media (max-width: 560px) {
				nav {
					display: none;
				}
				#themeBtn {
					margin-left: auto;
				}
			}

			/* content */
			.hero {
				padding-top: 100px;
			}
			.hero .role {
				margin: 6px 0 14px;
				font-family: var(--mono);
				font-size: 0.8125rem;
				color: var(--accent);
			}
			.hero p + p {
				margin-top: 8px;
			}
			.row {
				display: flex;
				justify-content: space-between;
				gap: 16px;
				padding-top: 12px;
			}
			.row p {
				margin-top: 2px;
			}
			.row .mono {
				white-space: nowrap;
			}
			.cards {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
				gap: 12px;
				padding-top: 12px;
			}
			.card {
				background: var(--surface);
				border: 1px solid var(--line);
				border-radius: var(--radius);
				padding: 14px 16px;
			}
			.card p {
				margin: 6px 0 10px;
				font-size: 0.875rem;
			}
			.tags {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				align-items: center;
			}
			.tag {
				font-family: var(--mono);
				font-size: 11px;
				padding: 3px 6px;
				border-radius: 2px;
				border: 1px solid var(--line);
				color: var(--muted);
			}
			.tags .link {
				margin-left: auto;
				font-size: 0.8125rem;
			}
			.skills p,
			.certs p {
				padding-top: 8px;
			}
			.skills b {
				font-family: var(--mono);
				font-size: 0.8125rem;
				font-weight: 500;
				color: var(--heading);
			}
			footer {
				margin-top: 48px;
				padding: 20px 0 32px;
				border-top: 1px solid var(--line);
			}
			footer .wrap {
				display: flex;
				flex-wrap: wrap;
				gap: 6px 20px;
			}
			@media (max-width: 480px) {
				.row {
					flex-direction: column;
					gap: 0;
				}
			}
		</style>
	</head>
	<body>
		<header>
			<div class="nav-inner">
				<a class="logo" href="#top" aria-label="Back to top">TS<span>.</span></a>
				<nav aria-label="Primary">
					<a href="#experience">Experience</a>
					<a href="#projects">Projects</a>
					<a href="#publications">Publications</a>
					<a href="#skills">Skills</a>
				</nav>
				<button id="themeBtn" type="button" aria-label="Toggle color theme">
					<svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
					<svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
				</button>
			</div>
		</header>

		<main id="top">
			<div class="hero"><div class="wrap" id="hero"></div></div>
			<section id="experience"><div class="wrap" id="experienceInner"></div></section>
			<section id="projects"><div class="wrap" id="projectsInner"></div></section>
			<section id="publications"><div class="wrap" id="publicationsInner"></div></section>
			<section id="education"><div class="wrap" id="educationInner"></div></section>
			<section id="skills"><div class="wrap" id="skillsInner"></div></section>
		</main>

		<footer><div class="wrap" id="footerInner"></div></footer>

		<script src="data.js"></script>
		<script>
			const D = portfolioData;
			const $ = (id) => document.getElementById(id);
			const esc = (s) =>
				String(s == null ? "" : s)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/"/g, "&quot;");
			const ext = (href, label) =>
				`<a class="link" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`;
			const section = (id, title, body) => {
				$(id + "Inner").innerHTML = `<h2>${title}</h2>${body}`;
			};

			const p = D.profile;
			document.title = `${p.name} - Portfolio`;

			$("hero").innerHTML = `
				<h1>${esc(p.name)}</h1>
				<p class="role">${esc(p.headline)} &middot; ${esc(p.location)}</p>
				${p.about.map((t) => `<p>${esc(t)}</p>`).join("")}`;

			section(
				"experience",
				"Experience",
				D.experience
					.map(
						(e) => `<div class="row"><div>
							<h3>${esc(e.title)}, ${esc(e.company)}</h3>
							<p>${esc(e.description)}</p></div>
							<span class="mono">${esc(e.startDate)} &ndash; ${esc(e.endDate)}</span></div>`,
					)
					.join(""),
			);

			section(
				"projects",
				"Projects",
				`<div class="cards">${D.projects
					.map(
						(x) => `<div class="card"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>
							<div class="tags">${(x.technologies || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}
							${x.link ? ext(x.link, "Link") : ""}</div></div>`,
					)
					.join("")}</div>`,
			);

			section(
				"publications",
				"Publications",
				D.publications
					.map(
						(x) => `<div class="row"><div>
							<h3>${x.url ? ext(x.url, x.title) : esc(x.title)}</h3>
							<p>${esc(x.conference)}</p></div>
							<span class="mono">${esc(x.year)}</span></div>`,
					)
					.join(""),
			);

			section(
				"education",
				"Education",
				D.education
					.map(
						(e) => `<div class="row"><div>
							<h3>${esc(e.degree)}, ${esc(e.school)}</h3>
							<p>${esc(e.field)}</p></div>
							<span class="mono">${esc(e.startDate)} &ndash; ${esc(e.endDate)}</span></div>`,
					)
					.join("") +
					`<div class="certs"><p><b class="mono">Certifications:</b> ${D.certifications
						.map((c) => esc(c.name))
						.join("; ")}</p></div>`,
			);

			section(
				"skills",
				"Skills",
				`<div class="skills">${Object.entries(D.skills)
					.map(([k, v]) => `<p><b>${esc(k)}:</b> ${v.map((s) => esc(s.name)).join(", ")}</p>`)
					.join("")}</div>`,
			);

			$("footerInner").innerHTML =
				(p.links.email ? ext("mailto:" + p.links.email, "Email") : "") +
				ext(p.links.linkedin, "LinkedIn") +
				ext(p.links.github, "GitHub");

			$("themeBtn").addEventListener("click", () => {
				const root = document.documentElement;
				const cur =
					root.getAttribute("data-theme") ||
					(matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
				const next = cur === "light" ? "dark" : "light";
				root.setAttribute("data-theme", next);
				try {
					localStorage.setItem("theme", next);
				} catch (e) {}
			});
		</script>
	</body>
</html>
