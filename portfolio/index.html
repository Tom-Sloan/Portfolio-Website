<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title id="page-title">Tom Sloan - Portfolio</title>
		<meta
			name="description"
			content="Tom Sloan: Payload Sensor Specialist at NRC Aerospace. Sensors, autonomous systems, robotics and applied AI."
		/>
		<meta name="color-scheme" content="dark light" />

		<link rel="icon" type="image/png" sizes="48x48" href="favicon.png" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="shortcut icon" href="favicon.ico" />
		<link rel="mask-icon" href="safari-pinned-tab.svg" color="#00DDC0" />

		<link rel="preload" href="data.js" as="script" />

		<!-- Apply saved theme before first paint -->
		<script>
			try {
				var t = localStorage.getItem("theme");
				if (t === "light" || t === "dark")
					document.documentElement.setAttribute("data-theme", t);
			} catch (e) {}
		</script>

		<style>
			:root {
				color-scheme: dark;
				--bg: #0a0d13;
				--bg-soft: #0f131b;
				--surface: #131822;
				--surface-2: #1a2130;
				--line: rgba(255, 255, 255, 0.08);
				--line-strong: rgba(255, 255, 255, 0.16);
				--text: #c9d1de;
				--heading: #f4f6fa;
				--muted: #8b95a7;
				--accent: #2dd4bf;
				--accent-ink: #04211d;
				--accent-soft: rgba(45, 212, 191, 0.12);
				--warm: #f5b544;
				--ok: #4ade80;
				--shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.28);
				--nav-bg: rgba(10, 13, 19, 0.78);
				--glow-a: rgba(45, 212, 191, 0.14);
				--glow-b: rgba(99, 102, 241, 0.12);

				--sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
					"Helvetica Neue", Arial, "Noto Sans", sans-serif;
				--mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
					"Liberation Mono", monospace;

				--fs-0: 0.8125rem;
				--fs-1: 0.9375rem;
				--fs-2: 1.0625rem;
				--fs-3: 1.25rem;
				--fs-4: clamp(1.5rem, 1.2rem + 1.2vw, 2rem);
				--fs-5: clamp(2.25rem, 1.4rem + 3.6vw, 4rem);
				--radius: 14px;
				--wrap: 1120px;
			}
			@media (prefers-color-scheme: light) {
				:root:not([data-theme="dark"]) {
					color-scheme: light;
					--bg: #fafaf8;
					--bg-soft: #f2f2ee;
					--surface: #ffffff;
					--surface-2: #f4f5f7;
					--line: rgba(15, 23, 42, 0.1);
					--line-strong: rgba(15, 23, 42, 0.2);
					--text: #364152;
					--heading: #0b1220;
					--muted: #5d6879;
					--accent: #0b7d70;
					--accent-ink: #ffffff;
					--accent-soft: rgba(11, 125, 112, 0.1);
					--warm: #a86400;
					--ok: #15803d;
					--shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.08);
					--nav-bg: rgba(250, 250, 248, 0.82);
					--glow-a: rgba(11, 125, 112, 0.12);
					--glow-b: rgba(99, 102, 241, 0.1);
				}
			}
			:root[data-theme="light"] {
				color-scheme: light;
				--bg: #fafaf8;
				--bg-soft: #f2f2ee;
				--surface: #ffffff;
				--surface-2: #f4f5f7;
				--line: rgba(15, 23, 42, 0.1);
				--line-strong: rgba(15, 23, 42, 0.2);
				--text: #364152;
				--heading: #0b1220;
				--muted: #5d6879;
				--accent: #0b7d70;
				--accent-ink: #ffffff;
				--accent-soft: rgba(11, 125, 112, 0.1);
				--warm: #a86400;
				--ok: #15803d;
				--shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 12px 28px rgba(15, 23, 42, 0.08);
				--nav-bg: rgba(250, 250, 248, 0.82);
				--glow-a: rgba(11, 125, 112, 0.12);
				--glow-b: rgba(99, 102, 241, 0.1);
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			* {
				margin: 0;
			}
			html {
				scroll-behavior: smooth;
				scroll-padding-top: 72px;
				-webkit-text-size-adjust: 100%;
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: var(--sans);
				font-size: var(--fs-1);
				line-height: 1.65;
				-webkit-font-smoothing: antialiased;
				overflow-x: hidden;
			}
			img,
			video {
				display: block;
				max-width: 100%;
			}
			a {
				color: inherit;
			}
			button {
				font: inherit;
				color: inherit;
			}
			::selection {
				background: var(--accent-soft);
				color: var(--heading);
			}
			:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 3px;
				border-radius: 4px;
			}
			.sr-only {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip: rect(0 0 0 0);
				white-space: nowrap;
			}
			.skip {
				position: absolute;
				left: 12px;
				top: -60px;
				background: var(--accent);
				color: var(--accent-ink);
				padding: 8px 14px;
				border-radius: 8px;
				z-index: 300;
				text-decoration: none;
			}
			.skip:focus {
				top: 12px;
			}

			/* ── Layout ── */
			.wrap {
				max-width: var(--wrap);
				margin: 0 auto;
				padding: 0 24px;
			}
			section {
				padding: 88px 0 0;
			}
			.eyebrow {
				font-family: var(--mono);
				font-size: var(--fs-0);
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--accent);
				margin-bottom: 10px;
			}
			.section-head {
				margin-bottom: 36px;
				max-width: 640px;
			}
			h2 {
				font-size: var(--fs-4);
				line-height: 1.15;
				letter-spacing: -0.02em;
				color: var(--heading);
				font-weight: 700;
			}
			.section-sub {
				margin-top: 10px;
				color: var(--muted);
			}

			/* ── Buttons & tags ── */
			.btn {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				padding: 11px 20px;
				border-radius: 10px;
				font-size: var(--fs-1);
				font-weight: 600;
				text-decoration: none;
				border: 1px solid var(--line-strong);
				background: transparent;
				color: var(--heading);
				cursor: pointer;
				transition: transform 0.15s, background 0.15s, border-color 0.15s;
			}
			.btn:hover {
				border-color: var(--accent);
				background: var(--accent-soft);
			}
			.btn-primary {
				background: var(--accent);
				color: var(--accent-ink);
				border-color: var(--accent);
			}
			.btn-primary:hover {
				background: var(--accent);
				filter: brightness(1.08);
				transform: translateY(-1px);
			}
			.btn svg {
				width: 16px;
				height: 16px;
			}
			.tags {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.tag {
				font-size: 12px;
				line-height: 1;
				padding: 6px 10px;
				border-radius: 999px;
				color: var(--muted);
				border: 1px solid var(--line);
				background: var(--surface-2);
				white-space: nowrap;
			}
			.pill {
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.02em;
				padding: 4px 10px;
				border-radius: 999px;
				line-height: 1.2;
			}
			.link {
				color: var(--accent);
				text-decoration: none;
				font-weight: 600;
				font-size: var(--fs-0);
			}
			.link:hover {
				text-decoration: underline;
				text-underline-offset: 3px;
			}

			/* ── Nav ── */
			header.nav {
				position: fixed;
				inset: 0 0 auto 0;
				z-index: 100;
				border-bottom: 1px solid transparent;
				transition: background 0.25s, border-color 0.25s, backdrop-filter 0.25s;
			}
			header.nav.scrolled {
				background: var(--nav-bg);
				-webkit-backdrop-filter: blur(14px) saturate(1.4);
				backdrop-filter: blur(14px) saturate(1.4);
				border-bottom-color: var(--line);
			}
			.nav-inner {
				max-width: var(--wrap);
				margin: 0 auto;
				padding: 0 24px;
				height: 60px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
			}
			.logo {
				font-family: var(--mono);
				font-weight: 700;
				font-size: var(--fs-2);
				color: var(--heading);
				text-decoration: none;
				letter-spacing: 0.02em;
			}
			.logo span {
				color: var(--accent);
			}
			.nav-links {
				display: flex;
				gap: 4px;
				align-items: center;
			}
			.nav-links a {
				padding: 8px 10px;
				font-size: var(--fs-0);
				color: var(--muted);
				text-decoration: none;
				border-radius: 8px;
				transition: color 0.15s;
			}
			.nav-links a:hover,
			.nav-links a.active {
				color: var(--heading);
			}
			.nav-links a.active {
				background: var(--accent-soft);
			}
			.icon-btn {
				width: 38px;
				height: 38px;
				display: inline-grid;
				place-items: center;
				border-radius: 10px;
				border: 1px solid var(--line);
				background: transparent;
				cursor: pointer;
				color: var(--heading);
				transition: border-color 0.15s, background 0.15s;
			}
			.icon-btn:hover {
				border-color: var(--accent);
				background: var(--accent-soft);
			}
			.icon-btn svg {
				width: 18px;
				height: 18px;
			}
			.nav-tools {
				display: flex;
				gap: 8px;
				align-items: center;
			}
			.menu-btn {
				display: none;
			}
			.mobile-menu {
				display: none;
				background: var(--bg);
				border-bottom: 1px solid var(--line);
				padding: 8px 24px 16px;
			}
			.mobile-menu a {
				display: block;
				padding: 12px 0;
				text-decoration: none;
				color: var(--heading);
				border-bottom: 1px solid var(--line);
			}
			.mobile-menu.open {
				display: block;
			}
			@media (max-width: 900px) {
				.nav-links {
					display: none;
				}
				.menu-btn {
					display: inline-grid;
				}
				header.nav.menu-open {
					background: var(--bg);
				}
			}
			.theme-moon {
				display: none;
			}
			:root:not([data-theme="light"]) .theme-sun {
				display: none;
			}
			:root:not([data-theme="light"]) .theme-moon {
				display: block;
			}
			@media (prefers-color-scheme: light) {
				:root:not([data-theme="dark"]) .theme-sun {
					display: block;
				}
				:root:not([data-theme="dark"]) .theme-moon {
					display: none;
				}
			}
			:root[data-theme="dark"] .theme-sun {
				display: none;
			}
			:root[data-theme="dark"] .theme-moon {
				display: block;
			}

			/* ── Hero ── */
			.hero {
				padding: 132px 0 24px;
				position: relative;
				isolation: isolate;
			}
			.hero::before {
				content: "";
				position: absolute;
				inset: -120px 0 0 0;
				z-index: -1;
				background:
					radial-gradient(600px 360px at 12% 8%, var(--glow-a), transparent 70%),
					radial-gradient(520px 340px at 88% 22%, var(--glow-b), transparent 70%);
			}
			.hero-grid {
				display: grid;
				grid-template-columns: minmax(0, 1.5fr) minmax(0, 0.8fr);
				gap: 56px;
				align-items: center;
			}
			.status {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 6px 14px 6px 12px;
				border-radius: 999px;
				border: 1px solid var(--line);
				background: var(--surface);
				font-size: var(--fs-0);
				color: var(--muted);
				margin-bottom: 26px;
				max-width: 100%;
			}
			.status i {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--ok);
				box-shadow: 0 0 0 0 var(--ok);
				animation: ping 2.4s ease-out infinite;
				flex: none;
			}
			@keyframes ping {
				0% {
					box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent);
				}
				80%,
				100% {
					box-shadow: 0 0 0 9px transparent;
				}
			}
			.hero h1 {
				font-size: var(--fs-5);
				line-height: 1.02;
				letter-spacing: -0.035em;
				font-weight: 800;
				color: var(--heading);
			}
			.hero .role {
				margin-top: 14px;
				font-size: var(--fs-3);
				font-weight: 600;
				color: var(--accent);
				letter-spacing: -0.01em;
			}
			.hero .lede {
				margin-top: 22px;
				font-size: var(--fs-2);
				line-height: 1.7;
				max-width: 56ch;
			}
			.hero-actions {
				margin-top: 30px;
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
			}
			.hero-meta {
				margin-top: 20px;
				color: var(--muted);
				font-size: var(--fs-0);
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.hero-meta svg {
				width: 14px;
				height: 14px;
				flex: none;
			}
			.portrait {
				position: relative;
				justify-self: end;
				width: min(100%, 340px);
			}
			.portrait::before {
				content: "";
				position: absolute;
				inset: 14px -14px -14px 14px;
				border-radius: 28px;
				border: 1px solid var(--accent);
				opacity: 0.45;
			}
			.portrait img {
				position: relative;
				width: 100%;
				aspect-ratio: 4 / 5;
				object-fit: cover;
				object-position: center 20%;
				border-radius: 28px;
				border: 1px solid var(--line-strong);
				background: var(--surface-2);
				box-shadow: var(--shadow);
			}
			.stats {
				margin-top: 64px;
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				border: 1px solid var(--line);
				border-radius: var(--radius);
				background: var(--surface);
				overflow: hidden;
			}
			.stat {
				padding: 22px 24px;
			}
			.stat + .stat {
				border-left: 1px solid var(--line);
			}
			.stat-num {
				font-size: clamp(1.75rem, 1.2rem + 1.6vw, 2.5rem);
				font-weight: 800;
				letter-spacing: -0.03em;
				color: var(--heading);
				line-height: 1;
				font-variant-numeric: tabular-nums;
			}
			.stat-label {
				margin-top: 8px;
				font-size: var(--fs-0);
				color: var(--muted);
			}
			@media (max-width: 860px) {
				.hero {
					padding-top: 108px;
				}
				.hero-grid {
					grid-template-columns: 1fr;
					gap: 40px;
				}
				.portrait {
					order: -1;
					justify-self: start;
					width: 132px;
				}
				.portrait::before {
					inset: 8px -8px -8px 8px;
					border-radius: 22px;
				}
				.portrait img {
					border-radius: 22px;
					aspect-ratio: 1;
				}
				.stats {
					grid-template-columns: repeat(2, minmax(0, 1fr));
					margin-top: 48px;
				}
				.stat:nth-child(3) {
					border-left: 0;
				}
				.stat:nth-child(n + 3) {
					border-top: 1px solid var(--line);
				}
			}

			/* ── About ── */
			.about-grid {
				display: grid;
				grid-template-columns: minmax(0, 1fr) minmax(0, 300px);
				gap: 56px;
				align-items: start;
			}
			.prose p {
				font-size: var(--fs-2);
				line-height: 1.75;
				max-width: 68ch;
			}
			.prose p + p {
				margin-top: 18px;
			}
			.prose p:first-child {
				color: var(--heading);
				font-size: var(--fs-3);
				line-height: 1.55;
				letter-spacing: -0.01em;
			}
			.aside-card {
				border: 1px solid var(--line);
				background: var(--surface);
				border-radius: var(--radius);
				padding: 22px;
				position: sticky;
				top: 84px;
			}
			.aside-card h3 {
				font-family: var(--mono);
				font-size: var(--fs-0);
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 14px;
				font-weight: 500;
			}
			.facts {
				list-style: none;
				padding: 0;
				display: grid;
				gap: 12px;
				font-size: var(--fs-1);
			}
			.facts li {
				display: grid;
				gap: 2px;
			}
			.facts b {
				color: var(--heading);
				font-weight: 600;
			}
			.facts span {
				color: var(--muted);
				font-size: var(--fs-0);
			}
			.aside-card .hero-actions {
				margin-top: 20px;
			}
			@media (max-width: 860px) {
				.about-grid {
					grid-template-columns: 1fr;
					gap: 32px;
				}
				.aside-card {
					position: static;
				}
			}

			/* ── Timeline ── */
			.timeline {
				list-style: none;
				padding: 0;
				position: relative;
				display: grid;
				gap: 16px;
			}
			.timeline::before {
				content: "";
				position: absolute;
				left: 7px;
				top: 10px;
				bottom: 10px;
				width: 1px;
				background: var(--line-strong);
			}
			.tl-item {
				position: relative;
				padding-left: 36px;
				min-width: 0;
			}
			.tl-dot {
				position: absolute;
				left: 0;
				top: 26px;
				width: 15px;
				height: 15px;
				border-radius: 50%;
				background: var(--bg);
				border: 2px solid var(--line-strong);
			}
			.tl-item.current .tl-dot {
				border-color: var(--accent);
				background: var(--accent);
				box-shadow: 0 0 0 5px var(--accent-soft);
			}
			.card {
				border: 1px solid var(--line);
				background: var(--surface);
				border-radius: var(--radius);
				transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
				min-width: 0;
			}
			.card.clickable {
				cursor: pointer;
			}
			.card.clickable:hover {
				border-color: var(--line-strong);
				transform: translateY(-2px);
				box-shadow: var(--shadow);
			}
			.tl-card {
				padding: 22px 24px;
			}
			.tl-top {
				display: flex;
				gap: 16px;
				justify-content: space-between;
				align-items: flex-start;
				flex-wrap: wrap;
			}
			.tl-top > div {
				min-width: 0;
			}
			.tl-title {
				font-size: var(--fs-2);
				font-weight: 700;
				letter-spacing: -0.01em;
				color: var(--heading);
				line-height: 1.3;
			}
			.tl-title button {
				all: unset;
				cursor: pointer;
			}
			.tl-title button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 3px;
			}
			.tl-company {
				color: var(--accent);
				font-weight: 600;
				font-size: var(--fs-1);
				margin-top: 2px;
			}
			.tl-date {
				font-family: var(--mono);
				font-size: var(--fs-0);
				color: var(--muted);
			}
			.tl-desc {
				margin-top: 12px;
				color: var(--text);
			}
			.tl-card .tags {
				margin-top: 16px;
			}
			.tl-item.minor .tl-card {
				padding: 14px 20px;
				background: transparent;
			}
			.tl-item.minor .tl-title {
				font-size: var(--fs-1);
				font-weight: 600;
			}
			.tl-item.minor .tl-company {
				color: var(--muted);

			/* ── Projects ── */
			.projects-grid {

				gap: 24px;
			}
			.project {
				display: flex;
				flex-direction: column;
				overflow: hidden;
			}
			.project.lead {
				grid-column: 1 / -1;
				flex-direction: row;

			.project.lead .media {
				flex: 1.15;
				aspect-ratio: auto;
				min-height: 320px;
				border-bottom: 0;
				border-right: 1px solid var(--line);
			}
			.project.lead .p-body {
				flex: 1;
				padding: 32px;
			}
			.media {
				position: relative;
				aspect-ratio: 16 / 9;
				background: var(--surface-2);
				border-bottom: 1px solid var(--line);
				overflow: hidden;
			}
			.media img,
			.media video {
				width: 100%;
				height: 100%;
				object-fit: cover;
			}
			.media img.icon {
				object-fit: contain;
				padding: 12%;
				opacity: 0.9;
			}
			.media .vid-bg {
				position: absolute;
				inset: 0;
				transform: scale(1.3);
				filter: blur(22px) brightness(0.55);
			}
			.media .vid-fg {
				position: relative;
				object-fit: contain;
			}
			.media-empty {
				height: 100%;
				display: grid;
				place-items: center;
				background:
					linear-gradient(135deg, var(--accent-soft), transparent 60%),

				font-size: var(--fs-0);
				letter-spacing: 0.14em;
				color: var(--muted);
				text-transform: uppercase;
			}
			.slide {
				position: absolute;
				inset: 0;
				opacity: 0;
				transition: opacity 0.8s ease;
			}
			.slide.active {
				opacity: 1;
			}
			.dots {
				position: absolute;
				left: 50%;
				bottom: 10px;
				transform: translateX(-50%);
				display: flex;
				gap: 6px;
				z-index: 2;
			}
			.dots i {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.4);
				transition: background 0.3s;
			}
			.dots i.active {
				background: #fff;
			}
			.p-body {
				padding: 24px;
				display: flex;
				flex-direction: column;
				gap: 4px;
				flex: 1;
				min-width: 0;
			}
			.p-cats {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				margin-bottom: 10px;
			}
			.project h3 {
				font-size: var(--fs-3);
				letter-spacing: -0.02em;
				line-height: 1.25;
				color: var(--heading);
				font-weight: 700;
				overflow-wrap: anywhere;
			}
			.project.lead h3 {
				font-size: var(--fs-4);
			}
			.p-sub {
				color: var(--muted);
				font-size: var(--fs-1);
				line-height: 1.45;
			}
			.p-desc {
				margin: 12px 0 16px;
			}
			.p-foot {
				margin-top: auto;
				display: grid;
				gap: 14px;
			}
			.p-links {
				display: flex;
				flex-wrap: wrap;
				gap: 18px;
				align-items: center;
				justify-content: space-between;
			}
			.p-links .links {

				gap: 18px;
				flex-wrap: wrap;
			}
			.p-date {
				font-family: var(--mono);

				color: var(--muted);

				display: none;
				gap: 10px;

			.other-list.open {
				display: grid;
			}
			.other-item {
				padding: 16px 20px;
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 4px 20px;
				align-items: baseline;

			.other-item h4 {
				font-size: var(--fs-1);

				overflow-wrap: anywhere;

			.other-item p {
				grid-column: 1;
				font-size: var(--fs-0);

			}
			@media (max-width: 860px) {
				.projects-grid {
					grid-template-columns: 1fr;
				}
				.project.lead {
					flex-direction: column;
				}
				.project.lead .media {
					min-height: 0;
					aspect-ratio: 16 / 9;
					border-right: 0;
					border-bottom: 1px solid var(--line);
				}
				.project.lead .p-body {
					padding: 24px;
				}
				.other-item {
					grid-template-columns: 1fr;
				}
				.other-item .p-date {
					grid-row: auto;
					grid-column: 1;
				}

			/* ── Publications ── */
			.pubs {
				display: grid;

			.pub {
				display: grid;

			.pub-year {

			.pub h3 {
				font-size: var(--fs-2);

			/* ── Education ── */

					grid-template-columns: 1fr;

			/* ── Certifications ── */
			.cert-grid {

				background: transparent;

				display: flex;
				gap: 14px;
				align-items: flex-start;

			.cert-badge {
				width: 52px;
				height: 52px;
				flex: none;
				border-radius: 10px;
				object-fit: contain;
				background: #fff;
				border: 1px solid var(--line);
				padding: 4px;

			.cert-badge.ph {
				display: grid;
				place-items: center;
				background: var(--surface-2);
				color: var(--accent);
				font-family: var(--mono);
				font-weight: 700;
				font-size: var(--fs-0);
			}
			.cert-name {
				color: var(--heading);
				font-weight: 600;
				line-height: 1.35;
				font-size: var(--fs-1);
			}
			.cert-org {
				font-size: 12px;
				color: var(--muted);
				margin-top: 2px;

			.cert-meta {
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
				align-items: center;
				font-family: var(--mono);
				font-size: 12px;
				color: var(--muted);
			}
			.cert p {
				font-size: var(--fs-0);
				color: var(--muted);
				line-height: 1.55;
			}
			.cert .link {
				margin-top: auto;
			}

			/* ── GitHub ── */
			.gh {
				padding: 24px;
			}
			.gh-head {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				flex-wrap: wrap;
				margin-bottom: 16px;
				font-size: var(--fs-0);
				color: var(--muted);
			}
			#github-calendar {
				overflow-x: auto;
				min-height: 120px;
				display: grid;
				place-items: center;
				color: var(--muted);
				font-size: var(--fs-0);
			}
			#github-calendar h2,
			#github-calendar h3,
			#github-calendar .float-left,
			#github-calendar .float-right,
			#github-calendar .position-relative a {
				display: none !important;
			}
			#github-calendar {
				--color-calendar-graph-day-bg: var(--surface-2);
				--color-calendar-graph-day-L1-bg: color-mix(in srgb, var(--accent) 35%, var(--surface-2));
				--color-calendar-graph-day-L2-bg: color-mix(in srgb, var(--accent) 60%, var(--surface-2));
				--color-calendar-graph-day-L3-bg: color-mix(in srgb, var(--accent) 82%, var(--surface-2));
				--color-calendar-graph-day-L4-bg: var(--accent);
				border: 0 !important;
			}
			#github-calendar text {
				fill: var(--muted) !important;
			}
			#github-calendar svg {
				max-width: none;
			}

			/* ── Contact ── */
			.contact-box {
				border: 1px solid var(--line);
				border-radius: 24px;
				padding: clamp(28px, 5vw, 56px);
				background:
					radial-gradient(500px 240px at 90% 0%, var(--glow-a), transparent 70%),
					var(--surface);
			}
			.contact-box h2 {
				font-size: var(--fs-5);
				letter-spacing: -0.03em;
				line-height: 1.05;
				max-width: 18ch;
			}
			.contact-box p {
				margin-top: 16px;
				max-width: 52ch;
				font-size: var(--fs-2);
			}
			.contact-box .hero-actions {
				margin-top: 28px;
			}
			footer {
				margin-top: 64px;
				padding: 24px 0 40px;
				border-top: 1px solid var(--line);
				font-size: var(--fs-0);
				color: var(--muted);
			}
			footer .wrap {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				flex-wrap: wrap;
			}

			/* ── Modal ── */
			.overlay {
				position: fixed;
				inset: 0;
				z-index: 200;
				background: rgba(4, 6, 10, 0.72);
				-webkit-backdrop-filter: blur(4px);
				backdrop-filter: blur(4px);
				display: none;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}
			.overlay.open {
				display: flex;
			}
			.modal {
				position: relative;
				width: 100%;
				max-width: 820px;
				max-height: calc(100vh - 40px);
				max-height: calc(100dvh - 40px);
				overflow-y: auto;
				overscroll-behavior: contain;
				background: var(--surface);
				border: 1px solid var(--line-strong);
				border-radius: 20px;
				box-shadow: var(--shadow);
				animation: pop 0.22s ease;

			@keyframes pop {
				from {
					opacity: 0;
					transform: translateY(12px) scale(0.985);
				}
			}
			.modal-close {
				position: sticky;
				top: 12px;
				float: right;
				margin: 12px 12px -50px 0;
				z-index: 5;
				background: var(--surface);
			}
			.modal-body {
				padding: 32px;
			}
			.modal .media {
				border-bottom: 1px solid var(--line);
			}
			.modal h2 {
				padding-right: 40px;
			}
			.modal .m-sub {
				color: var(--accent);
				font-weight: 600;
				margin-top: 4px;
			}
			.m-meta {
				margin: 18px 0;
				display: flex;
				flex-wrap: wrap;
				gap: 6px 18px;
				font-size: var(--fs-0);
				color: var(--muted);
			}
			.m-desc {
				white-space: pre-line;
				margin: 16px 0 20px;
			}
			.m-h {
				font-family: var(--mono);
				font-size: var(--fs-0);
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--muted);
				margin-bottom: 10px;
			}
			.modal .hero-actions {
				margin-top: 24px;
			}
			@media (max-width: 560px) {
				.modal-body {
					padding: 22px;
				}
			}

			/* ── Back to top ── */
			.to-top {
				position: fixed;
				right: 18px;
				bottom: 18px;
				z-index: 90;
				background: var(--surface);
				opacity: 0;
				pointer-events: none;
				transform: translateY(8px);
				transition: opacity 0.2s, transform 0.2s;
			}
			.to-top.show {
				opacity: 1;
				pointer-events: auto;
				transform: none;
			}

			/* ── Reveal ── */
			.js .reveal {
				opacity: 0;
				transform: translateY(16px);
				transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
					transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
				transition-delay: var(--d, 0ms);
			}
			.js .reveal.in {
				opacity: 1;
				transform: none;
			}

			@media (max-width: 560px) {
				.wrap,
				.nav-inner {
					padding-left: 20px;
					padding-right: 20px;
				}
				section {
					padding-top: 64px;
				}
				.tl-card {
					padding: 18px;

				.tl-item {
					padding-left: 30px;
				}

					padding: 20px;
				}

				}

			@media (prefers-reduced-motion: reduce) {
				html {
					scroll-behavior: auto;
				}
				*,
				*::before,
				*::after {
					animation-duration: 0.001ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.001ms !important;
					transition-delay: 0ms !important;
				}
				.js .reveal {
					opacity: 1;
					transform: none;
				}
			}
		</style>

			document.documentElement.classList.add("js");

			const D = portfolioData;
			const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

			// ── helpers ──
			const esc = (s) =>
				String(s == null ? "" : s)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")

				const next = cur === "light" ? "dark" : "light";
				root.setAttribute("data-theme", next);

			function setupScrollSpy() {

			// ── projects ──
			function mediaFor(p, forModal) {

				if (!imgs.length) {
					return forModal ? "" : `<div class="media"><div class="media-empty">${p.current ? "In progress" : "Project"}</div></div>`;
				}
				if (imgs.length === 1 && /\.mp4$/i.test(imgs[0])) {
					const src = esc(imgs[0]);
					const attrs = reduceMotion ? 'preload="metadata"' : "";
					const lazy = forModal ? `src="${src}"` : `data-src="${src}"`;
					const auto = forModal && !reduceMotion ? "autoplay" : "";
					return `<div class="media"><video class="vid-bg" ${lazy} ${auto} ${attrs} loop muted playsinline aria-hidden="true" tabindex="-1"></video><video class="vid-fg" ${lazy} ${auto} ${attrs} ${reduceMotion ? "controls" : ""} loop muted playsinline aria-label="${esc(p.title)} demo"></video></div>`;
				}
				if (imgs.length === 1) {
					const remote = /^https?:/.test(imgs[0]);
					return `<div class="media"><img class="${remote ? "icon" : ""}" src="${esc(imgs[0])}" alt="${esc(p.title)}" loading="lazy" decoding="async" /></div>`;
				}
				return `<div class="media carousel">${imgs.map((src, i) =>
					`<img class="slide${i === 0 ? " active" : ""}" ${i === 0 ? `src="${esc(src)}"` : `data-src="${esc(src)}"`} alt="${esc(p.title)}, image ${i + 1}" ${forModal ? "" : 'loading="lazy"'} decoding="async" />`).join("")}<div class="dots">${imgs.map((_, i) => `<i class="${i === 0 ? "active" : ""}"></i>`).join("")}</div></div>`;

			function renderProjects() {

					c.tabIndex = 0;

							e.preventDefault();
							openProject(D.projects[+c.dataset.proj]);
						}
					});
				});
				const mb = $("moreProj");
				if (mb) {
					mb.addEventListener("click", () => {
						const open = !$("otherProj").classList.contains("open");
						$("otherProj").classList.toggle("open", open);
						mb.setAttribute("aria-expanded", String(open));
						mb.textContent = open ? "Hide other projects" : `More projects (${other.length})`;
					});
				}
				setupMedia(root);
			}

			// Lazy video + carousel; skipped under reduced motion
			function setupMedia(root) {
				const vids = root.querySelectorAll("video[data-src]");
				if (vids.length) {
					const io = new IntersectionObserver((entries) => {
						entries.forEach((en) => {
							const v = en.target;
							if (en.isIntersecting) {
								if (!v.src) { v.src = v.dataset.src; v.load(); }
								if (!reduceMotion) v.play().catch(() => {});
							} else if (v.src) {
								v.pause();
							}
						});
					}, { rootMargin: "100px" });
					vids.forEach((v) => io.observe(v));
				}
				if (!reduceMotion) {
					root.querySelectorAll(".carousel").forEach((c) => startCarousel(c));
				}
			}

			function loadSlide(s) {
				if (s && s.dataset.src) { s.src = s.dataset.src; s.removeAttribute("data-src"); }
			}
			function startCarousel(box) {
				const slides = box.querySelectorAll(".slide");
				const dots = box.querySelectorAll(".dots i");
				if (slides.length < 2) return null;
				let cur = 0;
				return setInterval(() => {
					const prev = cur;
					cur = (cur + 1) % slides.length;
					loadSlide(slides[cur]);
					loadSlide(slides[(cur + 1) % slides.length]);
					slides[prev].classList.remove("active");
					slides[cur].classList.add("active");
					dots[prev] && dots[prev].classList.remove("active");
					dots[cur] && dots[cur].classList.add("active");
				}, 4000);
			}

								<div class="cert-meta"><span>${esc(c.issueDate)}</span>${c.expirationDate ? `<span>&middot; ${c.expired ? "Expired" : "Expires"} ${esc(c.expirationDate)}</span>` : ""}</div>
								${c.description ? `<p>${esc(c.description)}</p>` : ""}
								${c.credentialUrl && !/credly\.com\/badges\/?$/.test(c.credentialUrl) ? `<a class="link" href="${esc(c.credentialUrl)}" target="_blank" rel="noopener">Verify &rarr;</a>` : ""}
							</article>`).join("")}
					</div>`;
			}

			// ── contact ──
			function renderContact() {
				const p = D.profile;
				$("contactInner").innerHTML = `
					<div class="contact-box reveal">
						<p class="eyebrow">Contact</p>
						<h2>Let's build something that operates in the real world.</h2>
						<p>Open to opportunities in robotics, defense, and applied AI.</p>
						<div class="hero-actions">
							<a class="btn btn-primary" href="${esc(p.links.linkedin)}" target="_blank" rel="noopener">${ICON.in} LinkedIn</a>
							<a class="btn" href="${esc(p.links.github)}" target="_blank" rel="noopener">${ICON.gh} GitHub</a>
							${p.links.scholar ? `<a class="btn" href="${esc(p.links.scholar)}" target="_blank" rel="noopener">Google Scholar</a>` : ""}
							${p.links.email ? `<a class="btn" href="mailto:${esc(p.links.email)}">Email</a>` : ""}
							${D.resume ? `<a class="btn" href="${esc(D.resume.path)}" target="_blank" rel="noopener">${ICON.doc} Resume</a>` : ""}
						</div>
					</div>`;
				$("footerInner").innerHTML = `<span>&copy; ${new Date().getFullYear()} ${esc(p.name)}</span><span>${esc(p.location)}</span>`;
				$("ghLink").href = p.links.github;
			}

			// ── GitHub calendar: load library only when near viewport ──
			function setupGitHub() {
				const user = D.profile.links.github.split("/").filter(Boolean).pop();
				const box = $("github-calendar");
				const fallback = () => {
					box.innerHTML = `<div><p style="margin-bottom:12px">Unable to load the contribution graph.</p><a class="btn" href="${esc(D.profile.links.github)}" target="_blank" rel="noopener">Visit GitHub profile</a></div>`;
				};
				const load = () => {
					const css = document.createElement("link");
					css.rel = "stylesheet";
					css.href = "https://unpkg.com/github-calendar@2.3.4/dist/github-calendar-responsive.css";
					document.head.appendChild(css);
					const s = document.createElement("script");
					s.src = "https://unpkg.com/github-calendar@2.3.4/dist/github-calendar.min.js";
					s.onload = () => {
						try {
							Promise.resolve(GitHubCalendar("#github-calendar", user, { responsive: true, tooltips: true, global_stats: false }))
								.then(() => { box.style.display = "block"; })
								.catch(fallback);
						} catch (e) { fallback(); }
					};
					s.onerror = fallback;
					document.body.appendChild(s);
				};
				if (!("IntersectionObserver" in window)) return load();
				const io = new IntersectionObserver((en) => {
					if (en[0].isIntersecting) { io.disconnect(); load(); }
				}, { rootMargin: "400px" });
				io.observe(box);
			}

			// ── modal ──
			let lastFocus = null;
			let modalTimer = null;
			function openModal(html) {
				lastFocus = document.activeElement;
				$("modalContent").innerHTML = html;
				$("overlay").classList.add("open");
				$("modal").scrollTop = 0;
				document.body.style.overflow = "hidden";
				const car = $("modalContent").querySelector(".carousel");
				if (car) {
					car.querySelectorAll(".slide[data-src]").forEach(loadSlide);
					if (!reduceMotion) modalTimer = startCarousel(car);
				}
				$("modalClose").focus();
			}
			function closeModal() {
				if (!$("overlay").classList.contains("open")) return;
				$("overlay").classList.remove("open");
				$("modalContent").innerHTML = "";
				document.body.style.overflow = "";
				if (modalTimer) { clearInterval(modalTimer); modalTimer = null; }
				if (lastFocus && lastFocus.focus) lastFocus.focus();
			}
			$("modalClose").addEventListener("click", closeModal);
			$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeModal(); });
			document.addEventListener("keydown", (e) => {
				if (e.key === "Escape") closeModal();
				if (e.key === "Tab" && $("overlay").classList.contains("open")) {
					const f = $("modal").querySelectorAll("a[href],button");
					if (!f.length) return;
					const first = f[0], last = f[f.length - 1];
					if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
					else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
				}
			});

			function openProject(p) {
				openModal(`
					${mediaFor(p, true)}
					<div class="modal-body">
						<div class="p-cats">${p.category.map((c) => `<span class="pill" style="color:${esc(c.color)};background:${hexAlpha(c.color, "22")}">${esc(c.tag)}</span>`).join("")}</div>
						<h2 id="modalTitle">${esc(p.title)}</h2>
						<div class="m-sub">${esc(p.subtitle || "")}</div>
						<div class="m-meta"><span>${range(p)}</span></div>
						<p class="m-desc">${esc(p.description.trim())}</p>
						${p.technologies && p.technologies.length ? `<div class="m-h">Technologies</div><div class="tags">${p.technologies.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
						<div class="hero-actions">
							${p.link ? `<a class="btn btn-primary" href="${esc(p.link)}" target="_blank" rel="noopener">View project ${ICON.arrow}</a>` : ""}
							${p.viewer3d ? `<a class="btn" href="${esc(p.viewer3d)}" target="_blank" rel="noopener">View in 3D ${ICON.arrow}</a>` : ""}
						</div>
					</div>`);
			}
			function openExperience(e) {
				openModal(`
					<div class="modal-body">
						<p class="eyebrow">${e.current ? "Current role" : "Experience"}</p>
						<h2 id="modalTitle">${esc(e.title)}</h2>
						<div class="m-sub">${esc(e.company)}</div>
						<div class="m-meta"><span>${range(e)}</span>${e.location ? `<span>${esc(e.location)}</span>` : ""}${e.employmentType ? `<span>${esc(e.employmentType)}</span>` : ""}</div>
						<p class="m-desc">${esc(e.description)}</p>
						${e.skills && e.skills.length ? `<div class="m-h">Skills</div><div class="tags">${e.skills.map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</div>` : ""}
					</div>`);
			}
			function openEducation(e) {
				openModal(`
					<div class="modal-body">
						<p class="eyebrow">Education</p>
						<h2 id="modalTitle">${esc(e.school)}</h2>
						<div class="m-sub">${esc(e.degree)}</div>
						<div class="m-meta"><span>${esc(e.field)}</span><span>${range(e)}</span>${e.grade ? `<span>${esc(e.grade)}</span>` : ""}</div>
						<p class="m-desc">${esc(e.description)}</p>
					</div>`);
			}

			// ── reveal on scroll ──
			function setupReveal() {
				const els = document.querySelectorAll(".reveal");
				if (reduceMotion || !("IntersectionObserver" in window)) {
					els.forEach((el) => el.classList.add("in"));
					return;
				}
				const io = new IntersectionObserver((entries) => {
					entries.forEach((en) => {
						if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
					});
				}, { threshold: 0.08, rootMargin: "0px 0px -4% 0px" });
				els.forEach((el) => io.observe(el));
			}

			// ── init ──
			function init() {
				document.title = `${D.profile.name} - ${D.profile.headline}`;
				const n = D.profile.name.split(" ");
				$("logo").innerHTML = `${esc(n.length > 1 ? n[0][0] + n[1][0] : n[0].slice(0, 2))}<span>.</span>`;
				renderNav();
				renderHero();
				renderAbout();
				renderExperience();
				renderProjects();
				renderPublications();
				renderEducation();
				renderSkills();
				renderCertifications();
				renderContact();
				setupReveal();
				setupScrollSpy();
				setupGitHub();
				window.dispatchEvent(new Event("scroll"));
			}
			if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
			else init();
		</script>
	</body>
</html>
